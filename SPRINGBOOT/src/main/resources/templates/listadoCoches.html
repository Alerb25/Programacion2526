<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Coches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>

<body>
    <h1>Listado de Coches</h1>
    <table>
        <thead>
            <tr class = "table-success">
                <th scope="col">#</th>
                <th scope="col">Marca</th>
                <th scope="col">Modelo</th>
                <th scope="col">Año</th>
                <th scope="col">Potencia</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="coche : listaCoches" class="table-primary">
                <th scope="row" th:text="${coche.id}">1</th>
                <td th:text="${coche.marca}">Marca</td>
                <td th:text="${coche.modelo}">Modelo</td>
                <td th:text="${coche.anno}">Año</td>
                <td th:text="${coche.potencia}">Potencia</td>
            </tr>

        <button type="button" class="btn btn-danger">Borrar</button>

        </tbody>
    </table>
</body>

</html>
