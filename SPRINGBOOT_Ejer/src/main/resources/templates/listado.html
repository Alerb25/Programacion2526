<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca de Videojuegos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Mis Videojuegos</h1>
    
    <form th:action="@{/videojuegos}" method="get" class="form-inline mb-3">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Buscar por título..." class="form-control mr-2" />
        <button type="submit" class="btn btn-secondary">Buscar / Ordenar</button>
        <a th:href="@{/videojuegos}" class="btn btn-light ml-2">Limpiar</a>
    </form>

    <a th:href="@{/videojuegos/add}" class="btn btn-primary mb-3">Añadir Nuevo Videojuego</a>

    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Título</th>
                <th>Género</th>
                <th>Precio</th>
                <th>Plataforma</th>
                <th>¿Completado?</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="juego : ${videojuegos}">
                <td th:text="${juego.titulo}"></td>
                <td th:text="${juego.genero}"></td>
                <td th:text="${juego.precio} + ' €'"></td>
                <td th:text="${juego.plataforma}"></td>
                <td th:text="${juego.completado ? 'Sí' : 'No'}"></td>
                <td>
                    <a th:href="@{/videojuegos/{id}(id=${juego.id})}" class="btn btn-sm btn-info">Ver</a>
                    <a th:href="@{/videojuegos/edit/{id}(id=${juego.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <a th:href="@{/videojuegos/eliminar/{id}(id=${juego.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminarlo?');">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
