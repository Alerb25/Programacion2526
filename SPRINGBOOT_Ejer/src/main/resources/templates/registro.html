<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Añadir Videojuego</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Añadir Nuevo Videojuego</h2>
    <form th:action="@{/videojuegos}" th:object="${videojuego}" method="post" class="mt-3">
        
        <div class="form-group">
            <label>Título:</label>
            <input type="text" th:field="*{titulo}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Género:</label>
            <select th:field="*{genero}" class="form-control">
                <option value="Acción">Acción</option>
                <option value="Aventura">Aventura</option>
                <option value="RPG">RPG</option>
                <option value="Estrategia">Estrategia</option>
                <option value="Deportes">Deportes</option>
            </select>
        </div>

        <div class="form-group">
            <label>Precio (€):</label>
            <input type="number" th:field="*{precio}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Plataforma principal:</label><br>
            <div class="form-check form-check-inline">
                <input type="radio" th:field="*{plataforma}" value="PC" class="form-check-input" checked>
                <label class="form-check-label">PC</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="radio" th:field="*{plataforma}" value="PS5" class="form-check-input">
                <label class="form-check-label">PS5</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="radio" th:field="*{plataforma}" value="XBOX" class="form-check-input">
                <label class="form-check-label">XBOX</label>
            </div>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" th:field="*{completado}" class="form-check-input">
            <label class="form-check-label">¿Lo has completado?</label>
        </div>

        <button type="submit" class="btn btn-success">Guardar Videojuego</button>
        <a th:href="@{/videojuegos}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
